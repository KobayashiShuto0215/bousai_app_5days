{% extends "base.html" %}

{% block content %}
<style>
  .shelter-results li { padding: 8px 10px; transition: background-color 120ms ease; }
  .shelter-results li:hover { background-color: #dceaf7; }
</style>
<h2>検索結果</h2>

{% if results %}
  <ul class="shelter-results">
    {% for shelter in results %}
    <li>{{ shelter.name }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>該当する避難所が見つかりませんでした</p>
{% endif %}

<p>
  <a href="/shelter_search">検索画面に戻る</a> |
  <a href="/">トップページへ戻る</a>
</p>
{% endblock %}
